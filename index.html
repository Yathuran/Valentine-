<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 Valentine's Day 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffc3a0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #ff4757;
            font-size: 2.5em;
            margin-bottom: 30px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .heart {
            font-size: 4em;
            margin-bottom: 20px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            position: relative;
            height: 120px;
            align-items: center;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #yesBtn {
            background: #ff4757;
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.4);
        }

        #noBtn {
            background: #ddd;
            color: #666;
            position: absolute;
            transition: all 0.3s ease;
        }

        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            animation: popIn 0.5s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .popup-content h2 {
            color: #ff4757;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .popup-content p {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 20px;
        }

        .celebration {
            font-size: 5em;
            animation: bounce 0.6s ease-in-out infinite;
            margin-bottom: 20px;
        }

        .photo-container {
            margin: 20px 0;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .photo-container img {
            width: 100%;
            max-width: 400px;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 15px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff4757;
            animation: confetti-fall 3s linear;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .hearts-animation {
            position: fixed;
            font-size: 2em;
            animation: float-up 4s linear;
            pointer-events: none;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            .container {
                padding: 40px 20px;
            }
            button {
                padding: 12px 30px;
                font-size: 1em;
            }
            .popup-content h2 {
                font-size: 1.5em;
            }
            .celebration {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">💕</div>
        <h1>Will You Be My Valentine?</h1>
        <div class="buttons">
            <button id="yesBtn">Yes! 💖</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div class="popup" id="popup">
        <div class="popup-content">
            <h2>You Made a Good Decision! 🎉</h2>
            <div class="celebration">🎊 🥳 🎉 💖 ✨</div>
            
            <!-- PHOTO WILL APPEAR HERE -->
            <div class="photo-container">
                <img id="valentinePhoto" src="IMG-20251118-WA0047.jpg" alt="My Valentine" />
            </div>
            
            <p style="font-size: 1.3em; color: #ff4757; font-weight: bold;">I love you! 💕</p>
            <p style="margin-top: 10px; font-size: 1em; color: #666;">Happy Valentine's Day! 💝</p>
        </div>
    </div>

    <!-- AUDIO ELEMENT FOR MUSIC -->
    <audio id="loveMusic" loop>
        <source src="Entha Pennilum Illatha Ondru.mp3" type="audio/mpeg">
    </audio>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const popup = document.getElementById('popup');
        const container = document.querySelector('.container');
        const loveMusic = document.getElementById('loveMusic');

        // Function to move the "No" button
        function moveNoButton() {
            const containerRect = container.getBoundingClientRect();
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            
            const maxX = containerRect.width - btnWidth - 80;
            const maxY = 100;
            
            const randomX = (Math.random() - 0.5) * maxX;
            const randomY = (Math.random() - 0.5) * maxY;
            
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // Desktop: Mouse hover detection
        document.addEventListener('mousemove', (e) => {
            const noRect = noBtn.getBoundingClientRect();
            const noCenterX = noRect.left + noRect.width / 2;
            const noCenterY = noRect.top + noRect.height / 2;
            
            const distance = Math.sqrt(
                Math.pow(e.clientX - noCenterX, 2) + 
                Math.pow(e.clientY - noCenterY, 2)
            );

            if (distance < 100) {
                moveNoButton();
            }
        });

        // Mobile: Touch/Tap detection
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // Handle "Yes" button click
        yesBtn.addEventListener('click', () => {
            popup.style.display = 'flex';
            
            // Play music
            loveMusic.play().catch(err => {
                console.log("Music autoplay prevented by browser:", err);
            });
            
            createConfetti();
            createFloatingHearts();
        });

        // Create confetti effect
        function createConfetti() {
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = ['#ff4757', '#ff6b81', '#ffa502', '#ff6348'][Math.floor(Math.random() * 4)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }

        // Create floating hearts
        function createFloatingHearts() {
            const hearts = ['💕', '💖', '💗', '💝', '💘'];
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'hearts-animation';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.bottom = '0';
                    heart.style.animationDelay = Math.random() * 2 + 's';
                    document.body.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 4000);
                }, i * 200);
            }
        }

        // Close popup when clicking outside
        popup.addEventListener('click', (e) => {
            if (e.target === popup) {
                popup.style.display = 'none';
                loveMusic.pause();
                loveMusic.currentTime = 0;
            }
        });
    </script>
</body>
</html>
