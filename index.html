<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 Will You Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-heart {
            position: fixed;
            font-size: 30px;
            opacity: 0.1;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-50px) rotate(180deg); }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: gold;
            border-radius: 50%;
            animation: sparkle 2s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        .heart {
            font-size: 5em;
            margin-bottom: 20px;
            animation: heartbeat 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 10px #ff4757);
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
            75% { transform: scale(1.2); }
        }

        h1 {
            color: #ff4757;
            font-size: 2.2em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .royal-name {
            font-family: 'Brush Script MT', 'Lucida Calligraphy', 'Lucida Handwriting', cursive;
            font-size: 1.3em;
            color: #d4af37;
            text-shadow: 3px 3px 6px rgba(212, 175, 55, 0.4);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .kiss-emoji {
            display: inline-block;
            font-size: 1.2em;
            animation: kiss-float 2s ease-in-out infinite;
        }

        .kiss-emoji:nth-child(1) {
            animation-delay: 0s;
        }

        .kiss-emoji:nth-child(2) {
            animation-delay: 0.3s;
        }

        .kiss-emoji:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes kiss-float {
            0%, 100% {
                transform: translateY(0) scale(1) rotate(0deg);
            }
            25% {
                transform: translateY(-10px) scale(1.2) rotate(10deg);
            }
            50% {
                transform: translateY(-5px) scale(1.1) rotate(-5deg);
            }
            75% {
                transform: translateY(-15px) scale(1.3) rotate(5deg);
            }
        }

        .song-name {
            font-size: 1.2em;
            color: #ff4757;
            margin-top: 30px;
            font-style: italic;
            animation: fade-in 1s ease-in;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .music-note {
            display: inline-block;
            animation: music-bounce 1s ease-in-out infinite;
        }

        @keyframes music-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            position: relative;
            min-height: 150px;
            align-items: center;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            box-shadow: 0 5px 20px rgba(255, 71, 87, 0.4);
        }

        #yesBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.6);
        }

        #noBtn {
            background: #ddd;
            color: #666;
            position: relative;
        }

        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-content {
            background: linear-gradient(135deg, #fff 0%, #ffeef8 100%);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: popIn 0.6s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .popup-content h2 {
            color: #ff4757;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .celebration {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .photo-frame {
            position: relative;
            margin: 30px auto;
            max-width: 400px;
            padding: 20px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.4);
        }

        .photo-frame img {
            width: 100%;
            border-radius: 15px;
            display: block;
        }

        .love-counter {
            font-size: 1.5em;
            color: #ff4757;
            margin: 20px 0;
            font-weight: bold;
        }

        .message {
            font-size: 1.3em;
            color: #333;
            margin: 10px 0;
        }

        .firework {
            position: fixed;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            pointer-events: none;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y));
                opacity: 0;
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8em; }
            .container { padding: 40px 20px; }
            button { padding: 12px 30px; font-size: 1em; }
        }
    </style>
</head>
<body>
    <div class="bg-heart" style="top: 10%; left: 10%;">💕</div>
    <div class="bg-heart" style="top: 20%; right: 15%; animation-delay: 2s;">💖</div>
    <div class="bg-heart" style="bottom: 15%; left: 20%; animation-delay: 4s;">💗</div>
    <div class="bg-heart" style="bottom: 25%; right: 10%; animation-delay: 6s;">💝</div>

    <div class="container">
        <div class="sparkle" style="top: 10%; left: 10%;"></div>
        <div class="sparkle" style="top: 15%; right: 15%; animation-delay: 0.5s;"></div>
        <div class="sparkle" style="bottom: 20%; left: 20%; animation-delay: 1s;"></div>
        <div class="sparkle" style="bottom: 15%; right: 10%; animation-delay: 1.5s;"></div>

        <div class="heart">💕</div>
        <h1><span class="royal-name">Keerthy</span>, Will You Be My Valentine?</h1>
        
        <div class="buttons">
            <button id="yesBtn">Yes! 💖</button>
            <button id="noBtn">No</button>
        </div>
        
        <div id="songDisplay" class="song-name" style="display: none;">
            <span class="music-note">🎵</span> Now Playing: Entha Pennilum Illatha Ondru <span class="music-note">🎵</span>
        </div>
    </div>

    <div class="popup" id="popup">
        <div class="popup-content">
            <h2>🎉 You Made The BEST Decision <span class="royal-name">Keerthy</span>! 🎉</h2>
            <div class="celebration">🎊 💖 ✨</div>
            
            <div class="photo-frame">
                <img src="IMG-20251118-WA0047.jpg" alt="My Beautiful Valentine" />
            </div>
            
            <div class="love-counter">
                I love you <span id="counter">0</span>% 💕
            </div>

            <div class="message">✨ <span class="royal-name">Keerthy</span>, you make my heart skip a beat!</div>
            <div class="message">💕 Every moment with you is magical!</div>
            <div class="message">🌟 You're my everything!</div>
            <div class="message">💖 Happy Valentine's Day, my love!</div>
        </div>
    </div>

    <audio id="loveMusic" loop>
        <source src="Entha Pennilum Illatha Ondru.mp3" type="audio/mpeg">
    </audio>

    <!-- Tension Music - You can replace this URL with any suspense/tension music -->
    <audio id="tensionMusic" loop autoplay>
        <!-- Option 1: Use a free tension music URL (replace with your choice) -->
        <!-- <source src="YOUR_TENSION_MUSIC.mp3" type="audio/mpeg"> -->
    </audio>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const popup = document.getElementById('popup');
        const container = document.querySelector('.container');
        const loveMusic = document.getElementById('loveMusic');
        const tensionMusic = document.getElementById('tensionMusic');
        
        let noScale = 1;
        let tensionAudioContext;
        let tensionOscillators = [];
        let tensionGainNode;

        // Create tension/suspense music using Web Audio API
        function createTensionMusic() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            tensionAudioContext = new AudioContext();
            tensionGainNode = tensionAudioContext.createGain();
            tensionGainNode.gain.value = 0.15; // Low volume for background
            tensionGainNode.connect(tensionAudioContext.destination);

            // Create a tense, suspenseful chord progression
            const frequencies = [
                [220, 277, 330], // Am chord
                [196, 247, 294], // G chord
                [208, 262, 311], // Ab chord
            ];

            let chordIndex = 0;

            function playChord() {
                // Stop previous oscillators
                tensionOscillators.forEach(osc => {
                    try { osc.stop(); } catch(e) {}
                });
                tensionOscillators = [];

                // Create new chord
                const currentFreqs = frequencies[chordIndex];
                currentFreqs.forEach(freq => {
                    const osc = tensionAudioContext.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    osc.connect(tensionGainNode);
                    osc.start();
                    tensionOscillators.push(osc);
                });

                chordIndex = (chordIndex + 1) % frequencies.length;
            }

            // Play chord progression every 2 seconds
            playChord();
            return setInterval(playChord, 2000);
        }

        // Stop tension music
        function stopTensionMusic() {
            tensionOscillators.forEach(osc => {
                try { osc.stop(); } catch(e) {}
            });
            tensionOscillators = [];
            if (tensionAudioContext) {
                tensionAudioContext.close();
            }
        }

        // Start tension music on first interaction
        let tensionInterval;
        let tensionStarted = false;
        function startTension() {
            if (!tensionStarted) {
                tensionStarted = true;
                tensionInterval = createTensionMusic();
            }
        }

        // Listen for first interaction to start tension music
        document.addEventListener('mousemove', startTension, { once: true });
        document.addEventListener('click', startTension, { once: true });
        document.addEventListener('touchstart', startTension, { once: true });

        // Move No button
        function moveNoButton() {
            noScale = Math.max(0.6, noScale - 0.08);
            
            const containerRect = container.getBoundingClientRect();
            const randomX = (Math.random() - 0.5) * (containerRect.width - 200);
            const randomY = (Math.random() - 0.5) * 80;
            
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px) scale(${noScale})`;
            noBtn.style.position = 'absolute';
            
            // Increase tension music volume slightly each time
            if (tensionGainNode) {
                tensionGainNode.gain.value = Math.min(0.3, tensionGainNode.gain.value + 0.02);
            }
        }

        // Mouse hover detection
        let lastMoveTime = 0;
        document.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastMoveTime < 50) return;
            lastMoveTime = now;

            const noRect = noBtn.getBoundingClientRect();
            const noCenterX = noRect.left + noRect.width / 2;
            const noCenterY = noRect.top + noRect.height / 2;
            
            const distance = Math.sqrt(
                Math.pow(e.clientX - noCenterX, 2) + 
                Math.pow(e.clientY - noCenterY, 2)
            );

            if (distance < 120) {
                moveNoButton();
            }
        });

        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // YES button - SHOW CELEBRATION!
        yesBtn.addEventListener('click', () => {
            console.log("YES clicked!");
            
            // Stop tension music
            stopTensionMusic();
            if (tensionInterval) clearInterval(tensionInterval);
            
            popup.style.display = 'flex';
            
            // Play love music
            loveMusic.play().catch(err => {
                console.log("Music error:", err);
            });
            
            // Start effects
            setTimeout(() => {
                animateLoveCounter();
                createFireworks();
                createConfetti();
            }, 100);
        });

        // Love counter animation
        function animateLoveCounter() {
            const counter = document.getElementById('counter');
            let count = 0;
            const interval = setInterval(() => {
                count += 2;
                counter.textContent = count;
                if (count >= 100) {
                    clearInterval(interval);
                    counter.textContent = '∞';
                }
            }, 30);
        }

        // Create FIREWORKS
        function createFireworks() {
            console.log("Creating fireworks!");
            const colors = ['#ff4757', '#ff6b81', '#ffa502', '#ff6348', '#fd79a8', '#fdcb6e'];
            
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight * 0.6;
                    
                    // Create explosion
                    for (let j = 0; j < 30; j++) {
                        const particle = document.createElement('div');
                        particle.className = 'firework';
                        particle.style.left = x + 'px';
                        particle.style.top = y + 'px';
                        particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                        
                        const angle = (Math.PI * 2 * j) / 30;
                        const velocity = 50 + Math.random() * 100;
                        const xVel = Math.cos(angle) * velocity;
                        const yVel = Math.sin(angle) * velocity;
                        
                        particle.style.setProperty('--x', xVel + 'px');
                        particle.style.setProperty('--y', yVel + 'px');
                        particle.style.animation = 'explode 1s ease-out forwards';
                        
                        document.body.appendChild(particle);
                        setTimeout(() => particle.remove(), 1000);
                    }
                }, i * 200);
            }
        }

        // Create CONFETTI
        function createConfetti() {
            console.log("Creating confetti!");
            const colors = ['#ff4757', '#ff6b81', '#ffa502', '#ff6348', '#fd79a8', '#fdcb6e'];
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animation = `fall ${2 + Math.random() * 2}s linear forwards`;
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 30);
            }
        }

        // Close popup
        popup.addEventListener('click', (e) => {
            if (e.target === popup) {
                popup.style.display = 'none';
                // DON'T pause music - let it continue playing!
                
                // Hide BOTH buttons
                noBtn.style.display = 'none';
                yesBtn.style.display = 'none';
                
                // Show song name
                document.getElementById('songDisplay').style.display = 'block';
                
                // Continue fireworks on main screen
                createContinuousFireworks();
                
                // Change the question with animated kiss emojis
                document.querySelector('h1').innerHTML = 'Thank You <span class="royal-name">Keerthy</span>, My Love! <span class="kiss-emoji">💋</span><span class="kiss-emoji">😘</span><span class="kiss-emoji">💕</span>';
            }
        });
        
        // Continuous fireworks for main screen
        let fireworkInterval;
        function createContinuousFireworks() {
            // Clear any existing interval
            if (fireworkInterval) clearInterval(fireworkInterval);
            
            // Create fireworks every second
            fireworkInterval = setInterval(() => {
                const colors = ['#ff4757', '#ff6b81', '#ffa502', '#ff6348', '#fd79a8', '#fdcb6e'];
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight * 0.6;
                
                for (let j = 0; j < 30; j++) {
                    const particle = document.createElement('div');
                    particle.className = 'firework';
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                    
                    const angle = (Math.PI * 2 * j) / 30;
                    const velocity = 50 + Math.random() * 100;
                    const xVel = Math.cos(angle) * velocity;
                    const yVel = Math.sin(angle) * velocity;
                    
                    particle.style.setProperty('--x', xVel + 'px');
                    particle.style.setProperty('--y', yVel + 'px');
                    particle.style.animation = 'explode 1s ease-out forwards';
                    
                    document.body.appendChild(particle);
                    setTimeout(() => particle.remove(), 1000);
                }
            }, 1000);
        }
    </script>
</body>
</html>
