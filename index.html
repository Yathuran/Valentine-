<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 Will You Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-heart {
            position: fixed;
            font-size: 30px;
            opacity: 0.1;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-50px) rotate(180deg); }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: gold;
            border-radius: 50%;
            animation: sparkle 2s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        .heart {
            font-size: 5em;
            margin-bottom: 20px;
            animation: heartbeat 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 10px #ff4757);
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
            75% { transform: scale(1.2); }
        }

        h1 {
            color: #ff4757;
            font-size: 2.2em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            min-height: 80px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            position: relative;
            min-height: 150px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            box-shadow: 0 5px 20px rgba(255, 71, 87, 0.4);
            position: relative;
            z-index: 1;
        }

        #yesBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.6);
        }

        #noBtn {
            background: #ddd;
            color: #666;
            position: relative;
        }

        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .popup-content {
            background: linear-gradient(135deg, #fff 0%, #ffeef8 100%);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .popup-content h2 {
            color: #ff4757;
            font-size: 2.5em;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .celebration {
            font-size: 5em;
            margin-bottom: 20px;
            animation: spin 2s ease-in-out infinite;
        }

        @keyframes spin {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
        }

        .photo-frame {
            position: relative;
            margin: 30px auto;
            max-width: 400px;
            padding: 20px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.4);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 15px 40px rgba(255, 215, 0, 0.4); }
            50% { box-shadow: 0 15px 60px rgba(255, 215, 0, 0.8); }
        }

        .photo-frame img {
            width: 100%;
            border-radius: 15px;
            display: block;
        }

        .love-counter {
            font-size: 1.5em;
            color: #ff4757;
            margin: 20px 0;
            font-weight: bold;
        }

        .message-container {
            margin: 20px 0;
        }

        .message {
            font-size: 1.3em;
            color: #333;
            margin: 10px 0;
            opacity: 0;
            animation: slideIn 0.8s ease forwards;
        }

        @keyframes slideIn {
            from { 
                opacity: 0;
                transform: translateX(-50px);
            }
            to { 
                opacity: 1;
                transform: translateX(0);
            }
        }

        .firework {
            position: fixed;
            border-radius: 50%;
            animation: firework 1s ease-out forwards;
        }

        @keyframes firework {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(40);
                opacity: 0;
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .floating-heart {
            position: fixed;
            font-size: 2em;
            animation: float-up 4s linear forwards;
            pointer-events: none;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8em; }
            .container { padding: 40px 20px; }
            button { padding: 12px 30px; font-size: 1em; }
            .popup-content h2 { font-size: 1.8em; }
            .celebration { font-size: 3em; }
        }
    </style>
</head>
<body>
    <div class="bg-heart" style="top: 10%; left: 10%;">💕</div>
    <div class="bg-heart" style="top: 20%; right: 15%; animation-delay: 2s;">💖</div>
    <div class="bg-heart" style="bottom: 15%; left: 20%; animation-delay: 4s;">💗</div>
    <div class="bg-heart" style="bottom: 25%; right: 10%; animation-delay: 6s;">💝</div>

    <div class="container">
        <div class="sparkle" style="top: 10%; left: 10%;"></div>
        <div class="sparkle" style="top: 15%; right: 15%; animation-delay: 0.5s;"></div>
        <div class="sparkle" style="bottom: 20%; left: 20%; animation-delay: 1s;"></div>
        <div class="sparkle" style="bottom: 15%; right: 10%; animation-delay: 1.5s;"></div>

        <div class="heart">💕</div>
        <h1>Will You Be My Valentine?</h1>
        
        <div class="buttons">
            <button id="yesBtn">Yes! 💖</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div class="popup" id="popup">
        <div class="popup-content">
            <h2>🎉 You Made The BEST Decision! 🎉</h2>
            <div class="celebration">🎊 💖 ✨</div>
            
            <div class="photo-frame">
                <img id="valentinePhoto" src="IMG-20251118-WA0047.jpg" alt="My Beautiful Valentine" />
            </div>
            
            <div class="love-counter">
                I love you <span id="counter">0</span>% 💕
            </div>

            <div class="message-container">
                <div class="message" style="animation-delay: 0.5s;">✨ You make my heart skip a beat!</div>
                <div class="message" style="animation-delay: 1s;">💕 Every moment with you is magical!</div>
                <div class="message" style="animation-delay: 1.5s;">🌟 You're my everything!</div>
                <div class="message" style="animation-delay: 2s;">💖 Happy Valentine's Day, my love!</div>
            </div>
        </div>
    </div>

    <audio id="loveMusic" loop>
        <source src="Entha Pennilum Illatha Ondru.mp3" type="audio/mpeg">
    </audio>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const popup = document.getElementById('popup');
        const container = document.querySelector('.container');
        const loveMusic = document.getElementById('loveMusic');
        
        let noClickCount = 0;
        let noScale = 1;
        let isPopupOpen = false;
        let audioContextInitialized = false;

        // Initialize Web Audio API on first user gesture
        let audioContext;
        function initAudio() {
            if (!audioContextInitialized) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();
                audioContextInitialized = true;
            }
        }

        // Function to play "whoosh" sound when No button dodges
        function playDodgeSound() {
            if (!audioContextInitialized) return;
            
            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch (e) {
                console.log("Sound play failed:", e);
            }
        }

        // Function to move the "No" button
        function moveNoButton() {
            if (isPopupOpen) return; // Don't move if popup is open
            
            noClickCount++;
            
            // Initialize audio on first dodge attempt
            if (!audioContextInitialized) {
                initAudio();
            }
            
            // Play dodge sound
            playDodgeSound();
            
            // Make No button slightly SMALLER each time
            noScale = Math.max(0.6, noScale - 0.08);
            
            // Calculate random position within container
            const containerRect = container.getBoundingClientRect();
            const randomX = (Math.random() - 0.5) * (containerRect.width - 200);
            const randomY = (Math.random() - 0.5) * 80;
            
            // Apply transform with both translation and scale
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px) scale(${noScale})`;
            noBtn.style.position = 'absolute';
        }

        // Desktop: Mouse hover detection
        let lastMoveTime = 0;
        document.addEventListener('mousemove', (e) => {
            if (isPopupOpen) return; // Don't track if popup is open
            
            // Throttle the event to improve performance
            const now = Date.now();
            if (now - lastMoveTime < 50) return;
            lastMoveTime = now;

            const noRect = noBtn.getBoundingClientRect();
            const noCenterX = noRect.left + noRect.width / 2;
            const noCenterY = noRect.top + noRect.height / 2;
            
            const distance = Math.sqrt(
                Math.pow(e.clientX - noCenterX, 2) + 
                Math.pow(e.clientY - noCenterY, 2)
            );

            // If mouse is within 120px of the "No" button, move it
            if (distance < 120) {
                moveNoButton();
            }
        });

        // Mobile: Touch/Tap detection
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        noBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // YES button clicked!
        yesBtn.addEventListener('click', () => {
            isPopupOpen = true;
            popup.style.display = 'flex';
            
            // Initialize audio if not already done
            if (!audioContextInitialized) {
                initAudio();
            }
            
            // Play music
            loveMusic.play().then(() => {
                console.log("Music playing!");
            }).catch(err => {
                console.log("Music autoplay prevented:", err);
            });
            
            // Start all effects
            animateLoveCounter();
            createFireworks();
            createConfetti();
            createFloatingHearts();
        });

        // Animate love counter to 100%
        function animateLoveCounter() {
            const counter = document.getElementById('counter');
            let count = 0;
            const interval = setInterval(() => {
                if (!isPopupOpen) {
                    clearInterval(interval);
                    return;
                }
                count += 2;
                counter.textContent = count;
                if (count >= 100) {
                    clearInterval(interval);
                    counter.textContent = '∞';
                }
            }, 30);
        }

        // Fireworks effect
        function createFireworks() {
            if (!isPopupOpen) return;
            const colors = ['#ff4757', '#ff6b81', '#ffa502', '#ff6348', '#fd79a8', '#fdcb6e'];
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    if (!isPopupOpen) return;
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * 100 + '%';
                    firework.style.top = Math.random() * 100 + '%';
                    firework.style.width = '10px';
                    firework.style.height = '10px';
                    firework.style.background = colors[Math.floor(Math.random() * colors.length)];
                    document.body.appendChild(firework);
                    
                    setTimeout(() => firework.remove(), 1000);
                }, i * 300);
            }
        }

        // Confetti
        function createConfetti() {
            if (!isPopupOpen) return;
            const colors = ['#ff4757', '#ff6b81', '#ffa502', '#ff6348', '#fd79a8', '#fdcb6e'];
            for (let i = 0; i < 150; i++) {
                setTimeout(() => {
                    if (!isPopupOpen) return;
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 20);
            }
        }

        // Floating hearts
        function createFloatingHearts() {
            if (!isPopupOpen) return;
            const hearts = ['💕', '💖', '💗', '💝', '💘', '❤️', '💓', '💞'];
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    if (!isPopupOpen) return;
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.bottom = '0';
                    heart.style.animationDelay = Math.random() * 2 + 's';
                    document.body.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 4000);
                }, i * 200);
            }
        }

        // Close popup
        popup.addEventListener('click', (e) => {
            if (e.target === popup) {
                isPopupOpen = false;
                popup.style.display = 'none';
                loveMusic.pause();
                loveMusic.currentTime = 0;
                
                // Clean up all effects
                document.querySelectorAll('.confetti, .floating-heart, .firework').forEach(el => el.remove());
                
                // Reset counter
                document.getElementById('counter').textContent = '0';
            }
        });

        // Debug logging
        document.getElementById('valentinePhoto').addEventListener('error', function() {
            console.error('Image failed to load');
        });

        document.getElementById('valentinePhoto').addEventListener('load', function() {
            console.log('Image loaded successfully!');
        });

        loveMusic.addEventListener('error', function(e) {
            console.error('Audio failed to load:', e);
        });

        loveMusic.addEventListener('loadeddata', function() {
            console.log('Audio loaded successfully!');
        });
    </script>
</body>
</html>
